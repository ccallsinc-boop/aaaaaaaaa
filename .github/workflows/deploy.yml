name: Deploy

# Deploys the site to Cloudflare Workers on every push to the default branch.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  account id from the Cloudflare dashboard sidebar
#
# And these repository variables (Settings > Secrets and variables > Variables):
#   VITE_SITE_URL                 the live domain, e.g. https://framers.com.br
#   VITE_SUPABASE_URL             from the Supabase project settings
#   VITE_SUPABASE_PUBLISHABLE_KEY from the Supabase project settings
#
# The VITE_ values must be present at BUILD time: Vite inlines them into the
# bundle, so setting them only as Worker runtime variables arrives too late.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .output/server/wrangler.json --name ${{ vars.WORKER_NAME || 'framers' }}
